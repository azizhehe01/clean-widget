# =============================================================================
# DOT-MATRIX + CHAMELEON FROSTED GLASS LOCKSCREEN (hyprlock)
# Part of DesktopWidgetsApp (/home/azhehe/.config/quickshell/DesktopWidgetsApp)
# =============================================================================

general {
    ignore_empty_input = true
    hide_cursor = false
    grace = 0
    disable_loading_bar = true
}

background {
    monitor =
    path = /tmp/nothing_lock_wallpaper
    color = rgba(12, 14, 18, 1.0)
    blur_passes = 4
    blur_size = 8
    noise = 0.015
    contrast = 1.04
    brightness = 0.62
    vibrancy = 0.22
    vibrancy_darkness = 0.25
    zindex = -1
}

# =============================================================================
# 1. TOP STATUS BAR (DOT-MATRIX HEADER)
# =============================================================================

# Top-Left: WiFi Status
label {
    monitor =
    text = cmd[update:5000] /home/azhehe/.config/quickshell/DesktopWidgetsApp/lockscreen/status.py wifi
    color = rgba(255, 255, 255, 0.82)
    font_size = 11
    font_family = Lettera Mono LL
    position = 48, -36
    halign = left
    valign = top
    zindex = 3
}

# Top-Center: Lock Indicator
label {
    monitor =
    text = [.LOCKED]
    color = rgba(255, 255, 255, 0.45)
    font_size = 10
    font_family = Lettera Mono LL
    position = 0, -37
    halign = center
    valign = top
    zindex = 3
}

# Top-Right: Battery Status
label {
    monitor =
    text = cmd[update:5000] /home/azhehe/.config/quickshell/DesktopWidgetsApp/lockscreen/status.py battery
    color = rgba(255, 255, 255, 0.82)
    font_size = 11
    font_family = Lettera Mono LL
    position = -48, -36
    halign = right
    valign = top
    zindex = 3
}

# =============================================================================
# 2. HERO DOT-MATRIX CLOCK & WEATHER SUBTITLE
# =============================================================================

# Hero Time (Ndot 57 Dot-Matrix)
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(255, 255, 255, 0.96)
    font_size = 108
    font_family = Ndot 57,
    position = 0, 235
    halign = center
    valign = center
    zindex = 3
}

# Date + Cached Weather + Location (Lettera Mono LL)
label {
    monitor =
    text = cmd[update:15000] /home/azhehe/.config/quickshell/DesktopWidgetsApp/lockscreen/status.py date-weather
    color = rgba(255, 255, 255, 0.78)
    font_size = 12
    font_family = Lettera Mono LL
    position = 0, 132
    halign = center
    valign = center
    zindex = 3
}

# =============================================================================
# 3. NOW PLAYING MEDIA PILL (FROSTED GLASS CARD)
# =============================================================================

# Frosted Glass Media Card Background
shape {
    monitor =
    size = 436, 138
    color = rgba(14, 16, 20, 0.56)
    rounding = 24
    border_size = 1
    border_color = rgba(255, 255, 255, 0.16)
    position = 0, -5
    halign = center
    valign = center
    zindex = 1
}

# Media Status Header (Red Dot + NOW PLAYING)
label {
    monitor =
    text = cmd[update:1500] /home/azhehe/.config/quickshell/DesktopWidgetsApp/lockscreen/status.py music-header
    color = rgba(255, 255, 255, 0.72)
    font_size = 10
    font_family = Lettera Mono LL
    position = 0, 40
    halign = center
    valign = center
    zindex = 3
}

# Song Title
label {
    monitor =
    text = cmd[update:1500] /home/azhehe/.config/quickshell/DesktopWidgetsApp/lockscreen/status.py music-title
    color = rgba(255, 255, 255, 0.96)
    font_size = 16
    font_family = NType 82 Headline
    position = 0, 12
    halign = center
    valign = center
    zindex = 3
}

# Artist Name
label {
    monitor =
    text = cmd[update:1500] /home/azhehe/.config/quickshell/DesktopWidgetsApp/lockscreen/status.py music-artist
    color = rgba(255, 255, 255, 0.65)
    font_size = 10
    font_family = Lettera Mono LL
    position = 0, -14
    halign = center
    valign = center
    zindex = 3
}

# Media Control: Previous
label {
    monitor =
    text = [ |◁ PREV ]
    color = rgba(255, 255, 255, 0.78)
    font_size = 10
    font_family = Lettera Mono LL
    position = -110, -46
    halign = center
    valign = center
    onclick = playerctl previous
    zindex = 3
}

# Media Control: Play / Pause
label {
    monitor =
    text = cmd[update:1000] /home/azhehe/.config/quickshell/DesktopWidgetsApp/lockscreen/status.py music-play-label
    color = rgba(255, 255, 255, 0.96)
    font_size = 10
    font_family = Lettera Mono LL
    position = 0, -46
    halign = center
    valign = center
    onclick = playerctl play-pause
    zindex = 3
}

# Media Control: Next
label {
    monitor =
    text = [ NEXT ▷| ]
    color = rgba(255, 255, 255, 0.78)
    font_size = 10
    font_family = Lettera Mono LL
    position = 110, -46
    halign = center
    valign = center
    onclick = playerctl next
    zindex = 3
}

# =============================================================================
# 4. PASSWORD INPUT CAPSULE (THE GLYPH PILL - NO FINGERPRINT)
# =============================================================================

input-field {
    monitor =
    size = 340, 54
    rounding = -1
    outline_thickness = 1
    outer_color = rgba(255, 255, 255, 0.22)
    inner_color = rgba(14, 16, 20, 0.62)
    font_family = Lettera Mono LL
    font_color = rgba(255, 255, 255, 0.95)
    dots_size = 0.24
    dots_spacing = 0.36
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffff80">ENTER PASSCODE</span>
    check_color = rgba(255, 255, 255, 0.85)
    fail_color = rgba(215, 25, 33, 0.95)
    fail_text = <span foreground="##ff3b30">ACCESS DENIED  ·  [$ATTEMPTS]</span>
    capslock_color = rgba(255, 180, 0, 0.90)
    numlock_color = rgba(0, 0, 0, 0)
    bothlock_color = rgba(255, 180, 0, 0.90)
    swap_font_color = false
    position = 0, -210
    halign = center
    valign = center
    zindex = 3
}

# Bottom User Tag
label {
    monitor =
    text = USER · $USER
    color = rgba(255, 255, 255, 0.48)
    font_size = 10
    font_family = Lettera Mono LL
    position = 0, -262
    halign = center
    valign = center
    zindex = 3
}
