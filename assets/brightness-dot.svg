<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
  <!-- Nothing OS Dot-Matrix Brightness / Sun Icon -->
  <g fill="#FFFFFF" fill-opacity="0.95">
    <!-- Center Core Dots (3x3 ring) -->
    <circle cx="10" cy="7.5" r="1.1"/>
    <circle cx="10" cy="12.5" r="1.1"/>
    <circle cx="7.5" cy="10" r="1.1"/>
    <circle cx="12.5" cy="10" r="1.1"/>
    <circle cx="8.2" cy="8.2" r="1.0"/>
    <circle cx="11.8" cy="8.2" r="1.0"/>
    <circle cx="8.2" cy="11.8" r="1.0"/>
    <circle cx="11.8" cy="11.8" r="1.0"/>

    <!-- Cardinal Rays (North, South, East, West) -->
    <circle cx="10" cy="4.2" r="1.1"/>
    <circle cx="10" cy="1.8" r="1.1"/>

    <circle cx="10" cy="15.8" r="1.1"/>
    <circle cx="10" cy="18.2" r="1.1"/>

    <circle cx="4.2" cy="10" r="1.1"/>
    <circle cx="1.8" cy="10" r="1.1"/>

    <circle cx="15.8" cy="10" r="1.1"/>
    <circle cx="18.2" cy="10" r="1.1"/>

    <!-- Diagonal Rays (NW, NE, SW, SE) -->
    <circle cx="5.2" cy="5.2" r="1.1"/>
    <circle cx="14.8" cy="5.2" r="1.1"/>
    <circle cx="5.2" cy="14.8" r="1.1"/>
    <circle cx="14.8" cy="14.8" r="1.1"/>
  </g>
</svg>

