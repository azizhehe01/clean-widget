<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- Second Screen Only: Left screen disabled (dim/dashed), Right screen active/highlighted -->
  <!-- Left Screen (Disabled) -->
  <rect x="2" y="8" width="7" height="8" rx="1.5" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.4"/>
  <line x1="4" y1="10" x2="7" y2="14" stroke="currentColor" stroke-width="1.2" opacity="0.4"/>

  <!-- Right External Screen (Large & Active) -->
  <rect x="11" y="4" width="11" height="13" rx="2" stroke="currentColor" stroke-width="1.8"/>
  <circle cx="14" cy="8" r="1.2" fill="currentColor"/>
  <circle cx="19" cy="8" r="1.2" fill="currentColor"/>
  <circle cx="16.5" cy="11.5" r="1.8" fill="currentColor"/>

  <!-- Right Stand -->
  <line x1="16.5" y1="17" x2="16.5" y2="19" stroke="currentColor" stroke-width="1.8"/>
  <rect x="13.5" y="19" width="6" height="2" rx="1" fill="currentColor"/>
</svg>
