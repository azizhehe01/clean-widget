<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- Extend: Screen 1 on Left, Screen 2 on Right -->
  <!-- Left Screen (1) -->
  <rect x="2" y="6" width="9" height="11" rx="1.8" stroke="currentColor" stroke-width="1.6"/>
  <circle cx="6.5" cy="11.5" r="1.4" fill="currentColor"/>

  <!-- Right Screen (2) with dot-matrix pattern -->
  <rect x="13" y="6" width="9" height="11" rx="1.8" stroke="currentColor" stroke-width="1.6"/>
  <circle cx="16" cy="9.5" r="1" fill="currentColor"/>
  <circle cx="19" cy="9.5" r="1" fill="currentColor"/>
  <circle cx="16" cy="13.5" r="1" fill="currentColor"/>
  <circle cx="19" cy="13.5" r="1" fill="currentColor"/>

  <!-- Connecting bridge / dots between screens -->
  <line x1="11" y1="11.5" x2="13" y2="11.5" stroke="currentColor" stroke-width="1.2" stroke-dasharray="1 1"/>

  <!-- Bottom stands -->
  <rect x="4" y="19" width="5" height="1.6" rx="0.8" fill="currentColor"/>
  <rect x="15" y="19" width="5" height="1.6" rx="0.8" fill="currentColor"/>
</svg>
