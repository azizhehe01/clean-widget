<svg xmlns="http://www.w3.org/2000/svg" width="44" height="36" viewBox="0 0 44 36" fill="none">
  <!-- Nothing OS Dot-Matrix Sun (upper-left, subtle translucent white dots) -->
  <g fill="#FFFFFF" fill-opacity="0.55">
    <circle cx="8"  cy="4"  r="1.4"/>
    <circle cx="12" cy="4"  r="1.4"/>
    <circle cx="4"  cy="8"  r="1.4"/>
    <circle cx="8"  cy="8"  r="1.4"/>
    <circle cx="12" cy="8"  r="1.4"/>
    <circle cx="16" cy="8"  r="1.4"/>
    <circle cx="4"  cy="12" r="1.4"/>
    <circle cx="8"  cy="12" r="1.4"/>
    <circle cx="12" cy="12" r="1.4"/>
    <circle cx="16" cy="12" r="1.4"/>
    <circle cx="8"  cy="16" r="1.4"/>
  </g>
  <!-- Nothing OS Dot-Matrix Cloud (foreground, crisp pure white dots) -->
  <g fill="#FFFFFF" fill-opacity="0.98">
    <!-- Row 1 (cloud top dome) -->
    <circle cx="20" cy="12" r="1.5"/>
    <circle cx="24" cy="12" r="1.5"/>
    <!-- Row 2 -->
    <circle cx="16" cy="16" r="1.5"/>
    <circle cx="20" cy="16" r="1.5"/>
    <circle cx="24" cy="16" r="1.5"/>
    <circle cx="28" cy="16" r="1.5"/>
    <!-- Row 3 -->
    <circle cx="12" cy="20" r="1.5"/>
    <circle cx="16" cy="20" r="1.5"/>
    <circle cx="20" cy="20" r="1.5"/>
    <circle cx="24" cy="20" r="1.5"/>
    <circle cx="28" cy="20" r="1.5"/>
    <circle cx="32" cy="20" r="1.5"/>
    <circle cx="36" cy="20" r="1.5"/>
    <!-- Row 4 -->
    <circle cx="8"  cy="24" r="1.5"/>
    <circle cx="12" cy="24" r="1.5"/>
    <circle cx="16" cy="24" r="1.5"/>
    <circle cx="20" cy="24" r="1.5"/>
    <circle cx="24" cy="24" r="1.5"/>
    <circle cx="28" cy="24" r="1.5"/>
    <circle cx="32" cy="24" r="1.5"/>
    <circle cx="36" cy="24" r="1.5"/>
    <circle cx="40" cy="24" r="1.5"/>
    <!-- Row 5 (cloud flat base) -->
    <circle cx="12" cy="28" r="1.5"/>
    <circle cx="16" cy="28" r="1.5"/>
    <circle cx="20" cy="28" r="1.5"/>
    <circle cx="24" cy="28" r="1.5"/>
    <circle cx="28" cy="28" r="1.5"/>
    <circle cx="32" cy="28" r="1.5"/>
    <circle cx="36" cy="28" r="1.5"/>
